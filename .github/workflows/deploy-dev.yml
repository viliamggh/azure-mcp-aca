name: deploy-dev
on:
  push:
    branches: [dev]

env:
  WORKSPACE: dev 
  LABEL: dev              

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure using Federated Credentials
        uses: azure/login@v1
        with:
          client-id: ${{ vars.UAMI_ID }}
          tenant-id: ${{ vars.TENANT_ID }}
          subscription-id: ${{ vars.SUB_ID }}
          allow-no-subscriptions: true 

      - name: login to ACR 
        run: |
          az acr login --name ${{ vars.ACR_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ vars.ACR_NAME }}.azurecr.io/mcp:${{ github.sha }}

      # ---------- terraform apply ----------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        
      - name: Terraform Init
        run: terraform -chdir=terraform init -backend-config=backend.conf
        env:
          ARM_CLIENT_ID: ${{ vars.UAMI_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.SUB_ID }}
          ARM_TENANT_ID: ${{ vars.TENANT_ID }}
          ARM_USE_OIDC: true
      
      - name: Select or Create Terraform Workspace
        run: |
          terraform -chdir=terraform workspace select ${{ env.WORKSPACE }} \
            || terraform -chdir=terraform workspace new ${{ env.WORKSPACE }}
        env:
          ARM_CLIENT_ID: ${{ vars.UAMI_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.SUB_ID }}
          ARM_TENANT_ID: ${{ vars.TENANT_ID }}
          ARM_USE_OIDC: true
      
      - name: Terraform Apply
        run: |
          terraform -chdir=terraform apply -auto-approve \
            -var-file=env/dev.tfvars \
            -var="image_tag=${{ github.sha }}" \
            -var="revision_label=${{ env.LABEL }}" \
            -var="registry_identity_id=/subscriptions/${{ vars.SUB_ID }}/resourceGroups/${{ vars.RG_NAME }}/providers/Microsoft.ManagedIdentity/userAssignedIdentities/${{ vars.IDENTITY_NAME }}"
        env:
          ARM_CLIENT_ID: ${{ vars.UAMI_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.SUB_ID }}
          ARM_TENANT_ID: ${{ vars.TENANT_ID }}
          ARM_USE_OIDC: true

      - name: Get Container App URL
        run: |
          APP_FQDN=$(terraform -chdir=terraform output -raw container_app_fqdn)
          echo "🚀 Container App deployed successfully!"
          echo "📍 URL: https://$APP_FQDN"
          echo "APP_URL=https://$APP_FQDN" >> $GITHUB_ENV
        env:
          ARM_CLIENT_ID: ${{ vars.UAMI_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.SUB_ID }}
          ARM_TENANT_ID: ${{ vars.TENANT_ID }}
          ARM_USE_OIDC: true




